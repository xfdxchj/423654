name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Override path check (non-ASCII project path)
        run: |
          if ! grep -q "android.overridePathCheck=true" gradle.properties; then
            echo "android.overridePathCheck=true" >> gradle.properties
          fi

      - name: Compile Kotlin (fast validation)
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx6144M -Dorg.gradle.jvmargs=-Xmx6144M"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx6144M -Dorg.gradle.jvmargs=-Xmx6144M"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 30
